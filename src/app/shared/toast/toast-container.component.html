<div class="toast-stack" aria-live="polite" aria-relevant="additions">
  @for (item of toast.toasts(); track item.id) {
    <div
      class="toast"
      [class.toast--success]="item.kind === 'success'"
      [class.toast--error]="item.kind === 'error'"
      [class.toast--info]="item.kind === 'info'"
      role="status"
    >
      <div class="toast__body">
        <p class="toast__title">{{ item.title }}</p>
        @if (item.message) {
          <p class="toast__message">{{ item.message }}</p>
        }
      </div>
      <button
        type="button"
        class="toast__close"
        aria-label="Dismiss"
        (click)="toast.dismiss(item.id)"
      >
        ×
      </button>
    </div>
  }
</div>
